#
# release.yml builds cross-platform binaries and creates a GitHub release with
# an auto-incrementing patch version on every push to main, then bumps the
# formula in the homebrew-harbor tap so `brew upgrade harbor` picks up the new
# release.
#

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -count=1

      - name: Determine next version
        id: version
        run: |
          # Latest vX.Y.Z tag, or v0.0.0 when none exist.
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            NEXT_VERSION="v0.1.0"
          else
            PATCH=$((PATCH + 1))
            NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # THE FIVE ASSET NAMES BELOW ARE A PUBLIC CONTRACT. Renaming one does not
      # break this build — it breaks whatever downloads the old name, which only
      # surfaces as user reports days later. Update every consumer in the SAME
      # change.
      #
      # Consumers, as of this writing:
      #   - the homebrew-harbor tap formula, which pins the four non-Windows
      #     names alongside their checksums. bump-tap-formula.py fails the
      #     release when a name it expects is absent, so a rename breaks here
      #     rather than at someone's install.
      #   - harbor.my/install.sh, which fetches checksums.txt and verifies the
      #     binary it downloaded against it.
      # ---------------------------------------------------------------------
      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LDFLAGS="-X github.com/HarborMyNotes/harbor-cli/cmd.version=${VERSION}"
          mkdir -p dist
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/harbor-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/harbor-darwin-arm64 .
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/harbor-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/harbor-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/harbor-windows-amd64.exe .

      # Publishes a SHA-256 manifest so a download can be verified. The tap
      # formula's per-platform sha256 is copied straight out of this file, and
      # install.sh checks its download against it.
      - name: Generate checksums
        run: |
          cd dist
          # Bare filenames, no dist/ prefix, so `sha256sum -c checksums.txt`
          # works from a directory of downloaded release assets.
          #
          # The glob is `harbor-*`, NOT `*`. Expansion precedes redirection, so a
          # bare `*` is fine on a FIRST run — but on any run where checksums.txt
          # already exists it lists that file in its own manifest, which then
          # fails `-c`. A fresh runner means it cannot happen here; `harbor-*` is
          # simply the glob that stays correct anywhere, and it says what it
          # means.
          #
          # It is also narrower than the `files: dist/*` upload below: an asset
          # not named harbor-* would be published WITHOUT a checksum. Add it here
          # too if that ever happens.
          sha256sum harbor-* > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt
          # A cheap self-check, not a security guarantee: it re-hashes the same
          # files seconds later on the same disk, so only a truncated write or
          # bad hardware makes it fail. It does NOT verify the uploaded assets.
          sha256sum -c checksums.txt

      - name: Create tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

      # Pushes the new version into HarborMyNotes/homebrew-harbor. That is a
      # separate repo, so the default GITHUB_TOKEN cannot write to it; the
      # deploy key in HOMEBREW_TAP_DEPLOY_KEY grants write to that one repo and
      # nothing else.
      #
      # Unlike a push to this repo's main, this cannot trigger another release —
      # the tap has no release workflow. It does run the tap's formula tests,
      # which is where a bad checksum would surface.
      #
      # The release itself already exists by this point, so a failure here
      # leaves the tap stale rather than the release half-made.
      - name: Update the Homebrew tap formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 git@github.com:HarborMyNotes/homebrew-harbor.git tap

          python3 .github/scripts/bump-tap-formula.py \
            --formula tap/Formula/harbor.rb \
            --checksums dist/checksums.txt \
            --version "$VERSION"

          cd tap
          # A re-run at the same version rewrites nothing, so there is no commit
          # to make and no reason to fail the release.
          if git diff --quiet; then
            echo "Tap formula already at ${VERSION}; nothing to bump."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -aqm "Update harbor to ${VERSION}"
          git push origin main
